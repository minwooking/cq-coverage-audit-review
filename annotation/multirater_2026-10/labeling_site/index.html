<meta charset="utf-8">
<title>역량 질문 라벨링</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 한 화면 작업대. 왼쪽 판정 카드, 오른쪽 자료 뷰어(데스크톱 2단, 모바일 1단). */
:root {
  --bg: #eceff3;
  --surface: #fbfcfd;
  --surface-2: #f1f3f6;
  --ink: #1a2030;
  --muted: #566074;
  --line: #d3d8e0;
  --accent: #1f5f8b;
  --accent-ink: #ffffff;
  --accent-soft: #dbe9f3;
  --mark: #ffe58a;
  --mark-cur: #ff9f43;
  --warn: #8a5a00;
  --warn-soft: #fff1d0;
  --ok: #17694a;
  --ok-soft: #dcf1e7;
  --bad: #a2362b;
  --bad-soft: #fbe3df;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "D2Coding", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --vfs: 13px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11141a; --surface: #191d25; --surface-2: #212631; --ink: #e6e9ef; --muted: #98a1b3;
    --line: #2e3542; --accent: #74b2e2; --accent-ink: #0b1620; --accent-soft: #1f3447;
    --mark: #6b5a12; --mark-cur: #b8641a; --warn: #f0c36a; --warn-soft: #3a2f12;
    --ok: #6fd1a6; --ok-soft: #143326; --bad: #f09a8f; --bad-soft: #3a1b18;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11141a; --surface: #191d25; --surface-2: #212631; --ink: #e6e9ef; --muted: #98a1b3;
  --line: #2e3542; --accent: #74b2e2; --accent-ink: #0b1620; --accent-soft: #1f3447;
  --mark: #6b5a12; --mark-cur: #b8641a; --warn: #f0c36a; --warn-soft: #3a2f12;
  --ok: #6fd1a6; --ok-soft: #143326; --bad: #f09a8f; --bad-soft: #3a1b18;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; padding-inline: 16px; padding-block: 10px; box-sizing: border-box; overflow-x: hidden; }
*, *::before, *::after { box-sizing: border-box; }
h1, h2, h3 { text-wrap: balance; line-height: 1.3; margin: 0; }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

#app { height: 100%; display: flex; flex-direction: column; gap: 10px; max-width: 1700px; margin-inline: auto; }
header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
header.top h1 { font-size: 17px; font-weight: 700; }
.spacer { flex: 1; }
.tabs { display: flex; gap: 4px; }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; min-height: 36px; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.small { min-height: 30px; padding: 3px 9px; font-size: 13px; }
.btn[aria-pressed="true"], .btn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
kbd { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface-2); color: var(--muted); }
.btn.on kbd, .btn.primary kbd { color: inherit; background: transparent; border-color: currentColor; opacity: .8; }

main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.screen { flex: 1; min-height: 0; overflow: auto; }
.page { max-width: 820px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; padding-block: 8px 40px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
.panel h2 { font-size: 18px; margin-bottom: 8px; }
.step-h { display: flex; gap: 10px; align-items: baseline; }
.step-n { font-family: var(--font-mono); background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 0 8px; font-size: 13px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--font-mono); }
pre.sample { font-family: var(--font-mono); font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 8px 0; white-space: pre; }
pre.sample b { background: var(--mark); font-weight: 500; }
.ex { border-left: 3px solid var(--line); padding-left: 12px; margin-top: 10px; display: grid; gap: 4px; }
.pill { display: inline-block; font-size: 12px; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.checks { display: grid; gap: 10px; }
.checks label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.checks input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--accent); flex: none; }
.banner { border-radius: 10px; padding: 8px 12px; font-size: 14px; background: var(--warn-soft); color: var(--warn); border: 1px solid transparent; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.banner.info { background: var(--accent-soft); color: var(--ink); }

/* work */
.work { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(330px, 440px) minmax(0, 1fr); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.card-body { overflow: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; flex: 1; min-height: 0; }
.card-foot { border-top: 1px solid var(--line); padding: 10px 16px; display: grid; gap: 8px; background: var(--surface); border-radius: 0 0 12px 12px; }
.prog { display: grid; gap: 6px; }
.prog-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.prog-n { font-family: var(--font-mono); font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.qtext { font-size: 19px; font-weight: 700; line-height: 1.45; overflow-wrap: anywhere; }
.qko { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.qko .tag { font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-right: 6px; }
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 22px; text-align: center; display: grid; gap: 10px; justify-items: center; background: var(--surface-2); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
ul.files { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
ul.files li { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.lbl { font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg.r4 { grid-template-columns: repeat(4, 1fr); }
.seg .btn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 6px; line-height: 1.3; text-align: center; }
.seg .btn .big { font-weight: 700; font-size: 15px; }
.anchor-line { font-size: 13px; color: var(--muted); min-height: 2.6em; }
details > summary { cursor: pointer; font-size: 13px; color: var(--accent); }
details.anch ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
textarea, input[type="text"], input[type="search"] { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
textarea { resize: vertical; min-height: 64px; }
textarea.mono { font-family: var(--font-mono); font-size: 12.5px; }
.vcheck { font-size: 13px; padding: 4px 10px; border-radius: 8px; }
.vcheck.ok { background: var(--ok-soft); color: var(--ok); }
.vcheck.bad { background: var(--bad-soft); color: var(--bad); }
.vcheck.idle { color: var(--muted); }
.msg { font-size: 13px; color: var(--bad); min-height: 1.2em; }
.msg.good { color: var(--ok); }
.actions { display: flex; gap: 8px; }
.actions .primary { flex: 1; min-height: 44px; font-size: 16px; }
.cheer { font-size: 14px; background: var(--ok-soft); color: var(--ok); border-radius: 8px; padding: 6px 10px; }

/* viewer */
.vtools { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.vtools input[type="search"] { flex: 1 1 160px; min-width: 0; width: auto; }
.vcount { font-family: var(--font-mono); font-size: 12px; color: var(--muted); min-width: 5.5em; font-variant-numeric: tabular-nums; }
.vbody { flex: 1; min-height: 0; overflow: auto; position: relative; font-family: var(--font-mono); font-size: var(--vfs); line-height: 1.55; padding: 8px 10px 40px 0; }
.chunk { content-visibility: auto; contain-intrinsic-size: auto 2200px; }
.ln { position: relative; padding-left: 4.6em; white-space: pre-wrap; overflow-wrap: anywhere; min-height: 1.55em; }
.ln::before { content: attr(data-n); position: absolute; left: 0; width: 3.8em; text-align: right; color: var(--muted); opacity: .7; user-select: none; -webkit-user-select: none; font-variant-numeric: tabular-nums; }
.ln.flash { background: var(--accent-soft); }
.ln.gap { border-top: 1px dashed var(--line); margin-top: 4px; padding-top: 4px; }
.vfsel { min-height: 30px; font-size: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 2px 6px; }
.vfnote { font-size: 12px; color: var(--muted); padding: 2px 10px 4px; }
details.vlegend { font-size: 12.5px; padding: 2px 10px 6px; border-bottom: 1px solid var(--line); }
details.vlegend ul { margin: 4px 0 0; padding-left: 18px; color: var(--muted); }
details.vlegend code { font-family: var(--font-mono); background: var(--surface-2); border-radius: 4px; padding: 0 4px; color: var(--ink); }
mark { background: var(--mark); color: inherit; border-radius: 2px; }
mark.cur { background: var(--mark-cur); outline: 2px solid var(--mark-cur); }
.vstate { padding: 24px; color: var(--muted); }
.selbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 6px 10px; border-top: 1px solid var(--line); font-size: 13px; background: var(--surface-2); border-radius: 0 0 12px 12px; }
.selbar .sel { flex: 1 1 140px; min-width: 0; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono); font-size: 12px; }

/* tables (admin) */
.tw { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; white-space: nowrap; }
th { color: var(--muted); font-weight: 500; }
td.wrap { white-space: normal; min-width: 14em; max-width: 36em; overflow-wrap: anywhere; }

dialog { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; max-width: min(680px, calc(100vw - 32px)); max-height: calc(100dvh - 40px); overflow: auto; }
dialog::backdrop { background: rgba(10, 14, 22, .55); }
dialog h2 { font-size: 18px; margin-bottom: 8px; }
dialog .dbtn { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
dialog blockquote { margin: 6px 0; padding: 6px 12px; border-left: 3px solid var(--accent); background: var(--surface-2); font-size: 13px; }
dialog ul { padding-left: 20px; margin: 6px 0; }
dialog table td { white-space: normal; }

.loading { padding: 40px 0; text-align: center; color: var(--muted); }
.stat { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat > div { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--font-mono); font-size: 22px; font-variant-numeric: tabular-nums; }

.vtabs { display: flex; gap: 4px; padding: 6px 10px 0; border-bottom: 1px solid var(--line); }
.vtabs button { background: transparent; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; padding: 6px 14px; cursor: pointer; color: var(--muted); }
.vtabs button[aria-selected="true"] { background: var(--surface-2); color: var(--ink); border-color: var(--line); font-weight: 700; }
[hidden] { display: none !important; }
.pane { display: flex; flex-direction: column; flex: 1; min-height: 0; min-width: 0; }
.gtop { padding: 8px 10px; display: grid; gap: 6px; border-bottom: 1px solid var(--line); }
.grow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.grow input[type="text"] { flex: 1 1 200px; min-width: 0; width: auto; font-family: var(--font-mono); font-size: 13px; }
.gwrap { position: relative; flex: 1; min-height: 260px; }
#cy { position: absolute; inset: 0; background: var(--surface); }
.gcard { position: absolute; right: 8px; top: 8px; bottom: 8px; width: min(340px, calc(100% - 16px)); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; overflow: auto; font-size: 13px; box-shadow: 0 4px 18px rgba(0,0,0,.18); z-index: 3; }
.gcard h3 { font-size: 14px; overflow-wrap: anywhere; }
.gcard ul { margin: 6px 0; padding-left: 16px; }
.gcard li { overflow-wrap: anywhere; margin-bottom: 3px; }
.pill.dim { opacity: .55; text-decoration: line-through; }
.gnote { font-size: 13px; color: var(--muted); }
.gnote.warn { color: var(--warn); }
.glist { max-height: 120px; overflow: auto; padding: 4px 10px 8px; display: flex; flex-wrap: wrap; gap: 4px; }
.glist .btn { font-size: 12px; min-height: 26px; padding: 1px 8px; }
@media (max-width: 900px) {
  html, body { height: auto; }
  #app { height: auto; min-height: 100%; }
  .work { display: flex; flex-direction: column; }
  .card-body { overflow: visible; }
  .viewer { height: 78dvh; min-height: 420px; }
  .seg.r4 { grid-template-columns: repeat(2, 1fr); }
  .card-foot { position: sticky; bottom: 0; z-index: 2; border-radius: 12px; }
  .screen { overflow: visible; }
}
</style>

<div id="app">
  <header class="top">
    <h1>역량 질문 라벨링</h1>
    <nav class="tabs" id="tabs" aria-label="화면">
      <button class="btn small" id="tabWork" aria-pressed="true" hidden>작업</button>
      <button class="btn small" id="tabAdmin" aria-pressed="false" hidden>관리</button>
      <button class="btn small" id="tabReview" aria-pressed="false" hidden>문항 검토</button>
    </nav>
    <span class="spacer"></span>
    <button class="btn small" id="btnRules" hidden>판정 기준</button>
    <button class="btn small" id="btnHelp" hidden>도움말 <kbd>?</kbd></button>
    <button class="btn small" id="btnFiles" hidden>렌더링 파일</button>
    <button class="btn small" id="btnKo" hidden aria-pressed="true">참고 번역: 켜짐</button>
    <button class="btn small" id="btnTheme" title="화면 색상 바꾸기">화면: 자동</button>

  <div id="notices"></div>
  <main id="main"><div class="loading" id="loading" role="status">불러오는 중입니다.</div></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<script>
"use strict";
/* ---------- 설정 ---------- */
const TOTAL_EXPECT = 188;

const BREAK_MS = 25 * 60 * 1000;  // 휴식 알림 간격

const MAX_MARKS = 20000;
const CHEERS = [
  "벌써 10%예요. 차분하게 잘 진행하고 계세요.",

  "40%를 넘겼어요. 눈이 피곤하면 글자 크기를 조절해 보세요.",

  "60%를 지났어요. 꼼꼼함이 이 작업의 핵심이에요.",
  "70%예요. 마무리가 보이기 시작했어요.",

const CAT_KO = { concept_definition: "정의", taxonomy: "분류", relations: "관계", slots_facets: "슬롯·패싯", instances: "사례", methodology: "방법론" };
const ANCHORS = [
  "0  관련된 개념이나 관계가 없다.",

/* ---------- 상태 ---------- */
const ST = {
  cells: [], byId: new Map(), order: [], idx: 0,
  labels: new Map(),           // cellId -> 저장된 문서
  db: null, user: null, uid: null, isOwner: false, persistent: false,
  progress: null, pledged: false,
  timers: new Map(), fastOk: new Set(), searchCount: new Map(),
  views: new Map(), curView: null, form: null,
  screen: "loading", sessionStart: new Date().toISOString(), lastBreak: Date.now(), activeSince: Date.now(),
  breakOff: LS.get("brk-off") === "1", saving: false, cheer: "",
  doneKeys: new Set(), doneAll: new Set(), split: true, unsubDone: null, freeOk: new Set(), splitK: 2, doneBy: new Map()   /* 작업 나누기: 누군가 완료한 셀 id 집합 */
};

ST.gtext = new Map(); ST.gIdx = new Map(); ST.gStats = new Map();
/* ---------- 순서(시드 셔플 + 같은 질문 간격 제약) ---------- */
function xmur3(str) { let h = 1779033703 ^ str.length; for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } return function () { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return (h ^= h >>> 16) >>> 0; }; }

function makeOrder(cells, seedStr, gap) {
  const rnd = mulberry32(xmur3(seedStr)());
  const groups = new Map();

  const keys = [...groups.keys()].sort(); const last = new Map(); const out = [];
  for (let pos = 0; pos < cells.length; pos++) {
    let elig = keys.filter(k => groups.get(k).length && (!last.has(k) || pos - last.get(k) >= gap));
    let pick;
    if (elig.length) {
      // 남은 개수가 가장 많은 그룹을 우선(끝부분에서 같은 질문이 몰리는 것을 방지), 동률은 무작위
      const mx = Math.max(...elig.map(k => groups.get(k).length));
      const top = elig.filter(k => groups.get(k).length === mx);
      pick = top[Math.floor(rnd() * top.length)];
    } else {
      const rest = keys.filter(k => groups.get(k).length);
      pick = rest.reduce((a, b) => (last.get(a) ?? -1e9) <= (last.get(b) ?? -1e9) ? a : b);
    }
    out.push(groups.get(pick).pop()); last.set(pick, pos);
  }

}

  RV.keys = e => { if (ST.screen !== "review" || dlgOpen()) return; const tg = e.target; if (tg && (tg.tagName === "INPUT" || tg.tagName === "TEXTAREA")) return; if (e.code === "KeyA") { e.preventDefault(); save("approve"); } else if (e.code === "KeyX") { e.preventDefault(); save("exclude"); } else if (e.key === "ArrowRight") nav(1); else if (e.key === "ArrowLeft") nav(-1); };
}
document.addEventListener("keydown", e => { if (RV.keys) RV.keys(e); });

/* ---------- 휴식 알림 ---------- */
function breakTick() {
  if (document.hidden || ST.screen !== "work" || ST.breakOff) return;
  const now = Date.now(); ST.active = (ST.active || 0) + (now - (ST.tickAt || now)); ST.tickAt = now;
  if (ST.active - (ST.lastBreakActive || 0) >= BREAK_MS && !$("#brk")) {
    const b = el("div", { class: "banner info", role: "status" }, el("span", { text: "잠깐 쉬어가요. 25분 넘게 이어서 작업하셨어요. 눈을 쉬게 하고 오셔도 저장된 내용은 그대로예요." }),
      el("button", { class: "btn small", type: "button", text: "닫기", onclick: () => { ST.lastBreakActive = ST.active; notice("brk", null); } }),
      el("button", { class: "btn small", type: "button", text: "알림 끄기", onclick: () => { ST.breakOff = true; LS.set("brk-off", "1"); notice("brk", null); } }));
    notice("brk", b);
  }
}
ST.tickAt = Date.now();
document.addEventListener("visibilitychange", () => { ST.tickAt = Date.now(); });

/* ---------- 단축키 ---------- */
document.addEventListener("keydown", e => {
  if (e.isComposing || e.keyCode === 229) return;
  if (dlgOpen()) return;
  const t = e.target; const typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable);
  if (typing) {
    if (ST.screen === "work" && e.key === "Enter" && (e.ctrlKey || e.metaKey) && t.tagName === "TEXTAREA") { e.preventDefault(); saveAndNext(); }
    else if (e.key === "Escape") t.blur();
    return;
  }
  if (e.key === "?" ) { e.preventDefault(); $("#btnHelp").click(); return; }
  if (ST.screen !== "work") return;
  if (e.altKey && e.key === "ArrowLeft") { e.preventDefault(); goPrev(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === "KeyG" && !e.shiftKey) { e.preventDefault(); showTab(G.tab === "graph" ? "text" : "graph"); return; }
  if (e.key === "/") { e.preventDefault(); showTab("text"); $("#q").focus(); return; }
  if (e.key === "Enter") { if (t && (t.tagName === "BUTTON" || t.tagName === "A" || t.tagName === "SUMMARY")) return; e.preventDefault(); saveAndNext(); return; }
  if (e.shiftKey) { const m = /^Digit([0-3])$/.exec(e.code); if (m) { e.preventDefault(); setR(+m[1]); } return; }
  if (e.code === "Digit1" || e.code === "Numpad1") { e.preventDefault(); setS(1); return; }
  if (e.code === "Digit0" || e.code === "Numpad0") { e.preventDefault(); setS(0); return; }
  const rm = { KeyQ: 0, KeyW: 1, KeyE: 2, KeyR: 3 }[e.code]; if (rm != null) { e.preventDefault(); setR(rm); }
});

boot();
</script>
